name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: true

env:
  SGDK_IMAGE: ewrogers/sgdk:latest

jobs:
  helpers:
    name: Host helpers (${{ matrix.os }})
    env:
      SGDK_REQUIRE_HOST_CC: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  distribution:
    name: Skill installation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python tests/distribution.py

  containers:
    name: SGDK examples (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      SGDK_PLATFORM: linux/${{ matrix.arch }}
      SGDK_SKILLS_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: docker pull --platform "$SGDK_PLATFORM" "$SGDK_IMAGE"
      - run: python -m pip install -r tests/requirements-math.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/integration.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-${{ matrix.arch }}
          path: |
            build/integration/**/report.json
            build/integration/**/*.log
            build/cartridge-integration/bank-report.json
            build/scenes-integration/scenes-report.json
            build/ai-integration/ai-report.json
            build/math-integration/math-report.json
            build/platformer-integration/platformer-report.json
            build/shmup-integration/shmup-report.json
            build/carpet-integration/carpet-report.json
            build/carpet-integration/*.log
            build/best-practices-integration/best-practices-report.json
            build/best-practices-integration/*.log
            build/dialogue-integration/dialogue-report.json
            build/dialogue-integration/*.log
            build/pixellab-integration/pixellab-report.json
            build/pixellab-integration/*.log
            build/pixellab-shadow-integration/pixellab-shadow-report.json
            build/pixellab-shadow-integration/*.log
            build/asterfall-integration/asterfall-report.json
            build/asterfall-integration/*.log
            build/rpg-integration/rpg-report.json
            build/rpg-integration/*.log
            build/isometric-integration/isometric-report.json
            build/isometric-integration/*.log
            build/collision-integration/collision-report.json
            build/collision-integration/*.log
            build/animation-integration/animation-report.json
            build/animation-integration/*.log
            build/memory-integration/memory-report.json
            build/memory-integration/*.log
            build/streaming-integration/streaming-report.json
            build/streaming-integration/*.log
            build/effects-integration/effects-report.json
            build/effects-integration/*.log
            build/localization-integration/localization-report.json
            build/localization-integration/*.log
            build/testing-integration/*.json
            build/testing-integration/*.log

  compare:
    name: Compare generated ROMs
    needs: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: integration-*
          path: reports
      - name: Compare both build modes
        shell: python
        run: |
          import json
          from pathlib import Path
          reports = {arch: list(Path(f"reports/integration-{arch}").rglob("report.json"))
                     for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in reports.values()), reports
          results = {arch: json.loads(paths[0].read_text()) for arch, paths in reports.items()}
          assert all(result["passed"] for result in results.values())
          for mode in ["release_rom", "debug_rom"]:
              assert results["amd64"][mode] == results["arm64"][mode], mode
          bank_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("bank-report.json"))
                          for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in bank_reports.values()), bank_reports
          banks = {arch: json.loads(paths[0].read_text()) for arch, paths in bank_reports.items()}
          assert all(report["passed"] for report in banks.values())
          assert banks["amd64"]["hashes"] == banks["arm64"]["hashes"], banks
          scene_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("scenes-report.json"))
                           for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in scene_reports.values()), scene_reports
          scenes = {arch: json.loads(paths[0].read_text()) for arch, paths in scene_reports.items()}
          assert all(report["passed"] for report in scenes.values())
          assert scenes["amd64"]["hashes"] == scenes["arm64"]["hashes"], scenes
          ai_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("ai-report.json"))
                        for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in ai_reports.values()), ai_reports
          enemies = {arch: json.loads(paths[0].read_text()) for arch, paths in ai_reports.items()}
          assert all(report["passed"] for report in enemies.values())
          assert enemies["amd64"]["hashes"] == enemies["arm64"]["hashes"], enemies
          math_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("math-report.json"))
                          for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in math_reports.values()), math_reports
          maths = {arch: json.loads(paths[0].read_text()) for arch, paths in math_reports.items()}
          assert all(report["passed"] for report in maths.values())
          assert maths["amd64"]["hashes"] == maths["arm64"]["hashes"], maths
          platform_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("platformer-report.json"))
                              for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in platform_reports.values()), platform_reports
          platforms = {arch: json.loads(paths[0].read_text()) for arch, paths in platform_reports.items()}
          assert all(report["passed"] for report in platforms.values())
          assert platforms["amd64"]["hashes"] == platforms["arm64"]["hashes"], platforms
          shooter_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("shmup-report.json"))
                             for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in shooter_reports.values()), shooter_reports
          shooters = {arch: json.loads(paths[0].read_text()) for arch, paths in shooter_reports.items()}
          assert all(report["passed"] for report in shooters.values())
          assert shooters["amd64"]["hashes"] == shooters["arm64"]["hashes"], shooters
          carpet_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("carpet-report.json"))
                            for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in carpet_reports.values()), carpet_reports
          carpets = {arch: json.loads(paths[0].read_text()) for arch, paths in carpet_reports.items()}
          assert all(report["passed"] for report in carpets.values())
          assert carpets["amd64"]["hashes"] == carpets["arm64"]["hashes"], carpets
          assert carpets["amd64"]["budgets"] == carpets["arm64"]["budgets"], carpets
          practices_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("best-practices-report.json"))
                               for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in practices_reports.values()), practices_reports
          practices = {arch: json.loads(paths[0].read_text()) for arch, paths in practices_reports.items()}
          assert all(report["passed"] for report in practices.values())
          assert practices["amd64"]["hashes"] == practices["arm64"]["hashes"], practices
          dialogue_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("dialogue-report.json"))
                              for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in dialogue_reports.values()), dialogue_reports
          dialogues = {arch: json.loads(paths[0].read_text()) for arch, paths in dialogue_reports.items()}
          assert all(report["passed"] for report in dialogues.values())
          assert dialogues["amd64"]["hashes"] == dialogues["arm64"]["hashes"], dialogues
          assert dialogues["amd64"]["geometry"] == dialogues["arm64"]["geometry"], dialogues
          art_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("pixellab-report.json"))
                         for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in art_reports.values()), art_reports
          art = {arch: json.loads(paths[0].read_text()) for arch, paths in art_reports.items()}
          assert all(report["passed"] for report in art.values())
          assert art["amd64"]["hashes"] == art["arm64"]["hashes"], art
          assert art["amd64"]["budgets"] == art["arm64"]["budgets"], art
          shadow_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("pixellab-shadow-report.json"))
                            for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in shadow_reports.values()), shadow_reports
          shadows = {arch: json.loads(paths[0].read_text()) for arch, paths in shadow_reports.items()}
          assert all(report["passed"] for report in shadows.values())
          assert shadows["amd64"]["hashes"] == shadows["arm64"]["hashes"], shadows
          catalog_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("asterfall-report.json"))
                             for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in catalog_reports.values()), catalog_reports
          catalogs = {arch: json.loads(paths[0].read_text()) for arch, paths in catalog_reports.items()}
          assert all(report["passed"] for report in catalogs.values())
          assert catalogs["amd64"]["hashes"] == catalogs["arm64"]["hashes"], catalogs
          rpg_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("rpg-report.json"))
                         for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in rpg_reports.values()), rpg_reports
          adventures = {arch: json.loads(paths[0].read_text()) for arch, paths in rpg_reports.items()}
          assert all(report["passed"] for report in adventures.values())
          assert adventures["amd64"]["hashes"] == adventures["arm64"]["hashes"], adventures
          assert adventures["amd64"]["budgets"] == adventures["arm64"]["budgets"], adventures
          testing_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("testing-report.json"))
                             for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in testing_reports.values()), testing_reports
          testing = {arch: json.loads(paths[0].read_text()) for arch, paths in testing_reports.items()}
          assert all(report["passed"] for report in testing.values())
          assert testing["amd64"]["hashes"] == testing["arm64"]["hashes"], testing
          assert testing["amd64"]["final_digest"] == testing["arm64"]["final_digest"], testing
          localization_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("localization-report.json"))
                                  for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in localization_reports.values()), localization_reports
          locales = {arch: json.loads(paths[0].read_text()) for arch, paths in localization_reports.items()}
          assert all(report["passed"] for report in locales.values())
          for field in ["hashes", "font", "geometry"]:
              assert locales["amd64"][field] == locales["arm64"][field], (field, locales)
          effects_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("effects-report.json"))
                             for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in effects_reports.values()), effects_reports
          effects = {arch: json.loads(paths[0].read_text()) for arch, paths in effects_reports.items()}
          assert all(report["passed"] for report in effects.values())
          for field in ["hashes", "geometry", "trace_digest", "selection_instructions", "budgets"]:
              assert effects["amd64"][field] == effects["arm64"][field], (field, effects)
          isometric_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("isometric-report.json"))
                               for arch in ("arm64", "amd64")}
          assert all(len(paths) == 1 for paths in isometric_reports.values()), isometric_reports
          isometrics = {arch: json.loads(paths[0].read_text()) for arch, paths in isometric_reports.items()}
          assert all(report["passed"] for report in isometrics.values())
          assert isometrics["arm64"] == isometrics["amd64"], isometrics
          collision_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("collision-report.json"))
                               for arch in ("arm64", "amd64")}
          assert all(len(paths) == 1 for paths in collision_reports.values()), collision_reports
          collisions = {arch: json.loads(paths[0].read_text()) for arch, paths in collision_reports.items()}
          assert all(report["passed"] for report in collisions.values())
          assert collisions["arm64"] == collisions["amd64"], collisions
          animation_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("animation-report.json"))
                               for arch in ("arm64", "amd64")}
          assert all(len(paths) == 1 for paths in animation_reports.values()), animation_reports
          animations = {arch: json.loads(paths[0].read_text()) for arch, paths in animation_reports.items()}
          assert all(report["passed"] for report in animations.values())
          assert animations["arm64"] == animations["amd64"], animations
          memory_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("memory-report.json"))
                            for arch in ("arm64", "amd64")}
          assert all(len(paths) == 1 for paths in memory_reports.values()), memory_reports
          memories = {arch: json.loads(paths[0].read_text()) for arch, paths in memory_reports.items()}
          assert all(report["passed"] for report in memories.values())
          assert memories["arm64"] == memories["amd64"], memories
          streaming_reports = {arch: list(Path(f"reports/integration-{arch}").rglob("streaming-report.json"))
                               for arch in ["amd64", "arm64"]}
          assert all(len(paths) == 1 for paths in streaming_reports.values()), streaming_reports
          streams = {arch: json.loads(paths[0].read_text()) for arch, paths in streaming_reports.items()}
          assert all(report["passed"] for report in streams.values())
          for field in ["hashes", "geometry", "budgets"]:
              assert streams["amd64"][field] == streams["arm64"][field], (field, streams)
          print("All standard and Lab release/debug ROMs match across native ARM64 and AMD64.")
